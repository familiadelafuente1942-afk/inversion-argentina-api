<style>
/* Mismo entorno visual que NEXO 2: oscuro + dorado, vidrio, Barlow / Barlow Condensed / Michroma */
:root{
  --bg:#0d0e10;--surface:#16171a;--raise:#1d1f23;--line:#2a2c31;--fg:#ece8e1;--muted:#8f8b84;
  --gold:#b8915a;--gold-soft:rgba(184,145,90,.14);
  --verde:#3fa66b;--amarillo:#e0b43a;--naranja:#e5813a;--rojo:#e2493e;--azul:#5b8fd6;
  --gl:rgba(255,255,255,.07);--gl-hi:rgba(255,255,255,.30);--gl-line:rgba(255,255,255,.08);--gl-sh:rgba(0,0,0,.5);--gl-bar:rgba(18,19,23,.66);
  --g-a:rgba(255,255,255,.17);--g-b:rgba(255,255,255,.035);--g-c:rgba(255,255,255,.075);--g-edge:rgba(255,255,255,.26);--g-rim:rgba(255,255,255,.55);
  --amb1:rgba(184,145,90,.16);--amb2:rgba(70,110,190,.12);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--tech:"Michroma","Barlow Condensed",sans-serif;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;touch-action:manipulation;
  background:radial-gradient(120% 46% at 92% -4%,var(--amb1),transparent 62%),radial-gradient(90% 40% at 0% 38%,var(--amb2),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:4px;
  background:var(--gl-bar);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid var(--gl-line)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-family:var(--tech);letter-spacing:.16em;font-size:12px;text-transform:uppercase;color:var(--gold);font-weight:400}
.brand span{font-size:12px;color:var(--muted)}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:30px;line-height:1.05}h2{font-size:20px}h3{font-size:17px}
p{margin:0}
main[hidden]{display:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.glass,.card,.kpi{background:linear-gradient(158deg,var(--g-a),var(--g-b) 50%,var(--g-c));-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:inset 0 1.5px 1px var(--g-rim),inset 0 0 0 1px var(--g-edge);border:0}
.card{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:clamp(17px,5.4vw,23px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kl{font-size:12px;color:#c9c4bb;line-height:1.25}
.kpi .ks{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 14px;font-weight:600;text-align:center;display:inline-block}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120b}
.btn.ghost{background:none}.btn.sm{padding:6px 12px;font-size:13px}.btn.full{width:100%}
.btn.red{background:rgba(226,73,62,.14);border-color:var(--rojo);color:#ffb3ad}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.status{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.t-verde{color:var(--verde)}.t-rojo{color:var(--rojo)}.t-amarillo{color:var(--amarillo)}.t-naranja{color:var(--naranja)}.t-azul{color:var(--azul)}.t-gold{color:var(--gold)}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 11px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--gold);font-weight:600}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:11px 14px;border-radius:12px;text-align:left;width:100%}
.arow .n{font-weight:600}.arow .s{font-size:12px;color:var(--muted)}
.arow .p{font-family:var(--mono);text-align:right;font-size:14px}
.arow .v{text-align:right;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big{font-family:var(--display);font-size:34px;line-height:1;font-weight:600}
.sem{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:240px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.yo{align-self:flex-end;background:var(--gold);color:#16120b;border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;border-bottom-left-radius:4px}
.chatbar{display:flex;gap:8px;position:sticky;bottom:96px}
.chatbar input{flex:1}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.bottom .in{pointer-events:auto;max-width:640px;width:100%;display:flex;padding:6px;gap:2px;border-radius:999px;
  background:linear-gradient(158deg,var(--g-a),var(--g-b));-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:inset 0 1.5px 1px var(--g-rim),inset 0 0 0 1px var(--g-edge),0 14px 30px -10px var(--gl-sh)}
nav.bottom button{flex:1;border:0;background:none;padding:7px 2px 6px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current=page]{background:var(--gl);color:var(--fg);box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 0 0 .5px var(--gl-line)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(158deg,rgba(40,41,46,.96),rgba(22,23,26,.98));box-shadow:inset 0 2px 1px var(--g-rim),inset 0 0 0 1px var(--g-edge);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--raise);border-radius:999px;width:34px;height:34px;font-size:18px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:30;background:var(--raise);border:1px solid var(--gold);border-radius:999px;padding:8px 16px;font-size:13px}
.toast[hidden]{display:none}
canvas{max-width:100%}
.disc{font-size:11px;color:var(--muted);line-height:1.45;text-align:center}
@media (prefers-color-scheme:light){
  :root{--bg:#eceef3;--surface:#fff;--raise:#f3f4f8;--line:#d8dbe3;--fg:#0c0d10;--muted:#5a5d66;
    --gl:rgba(255,255,255,.66);--gl-hi:rgba(255,255,255,.95);--gl-line:rgba(0,0,0,.08);--gl-sh:rgba(40,40,70,.18);--gl-bar:rgba(244,245,250,.72);
    --g-a:rgba(255,255,255,.80);--g-b:rgba(255,255,255,.22);--g-c:rgba(255,255,255,.40);--g-edge:rgba(255,255,255,.95);--g-rim:#fff;
    --amb1:rgba(184,145,90,.22);--amb2:rgba(110,150,225,.2);color-scheme:light}
  .kpi .kl{color:#33363d}
  .sheet{background:linear-gradient(158deg,rgba(255,255,255,.97),rgba(243,244,248,.98))}
  .msg.yo{color:#16120b}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>NEXO · Inversión Lab</b><span id="estado">Cargando mercado…</span></div>
  </header>

  <main id="vista-inicio"></main>
  <main id="vista-mercado" hidden></main>
  <main id="vista-lab" hidden></main>
  <main id="vista-cartera" hidden></main>
  <main id="vista-socio" hidden></main>
</div>

<nav class="bottom" aria-label="Secciones">
  <div class="in">
    <button data-v="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-v="mercado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Mercado</button>
    <button data-v="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/></svg>Laboratorio</button>
    <button data-v="cartera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2M3 10h18M7 6V4h10v2"/></svg>Cartera</button>
    <button data-v="socio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>Socio IA</button>
  </div>
</nav>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============ Configuración ============ */
const ACTIVOS = [
  {id:"BTC", nombre:"Bitcoin", sector:"Cripto", tipo:"cripto", sym:"BTCUSDT", mon:"USDT"},
  {id:"ETH", nombre:"Ethereum", sector:"Cripto", tipo:"cripto", sym:"ETHUSDT", mon:"USDT"},
  {id:"SOL", nombre:"Solana", sector:"Cripto", tipo:"cripto", sym:"SOLUSDT", mon:"USDT"},
  {id:"YPFD", nombre:"YPF", sector:"Energía", tipo:"accion", clase:"stocks", mon:"ARS"},
  {id:"VIST", nombre:"Vista", sector:"Energía", tipo:"accion", clase:"stocks", alt:"cedears", mon:"ARS"},
  {id:"PAMP", nombre:"Pampa Energía", sector:"Energía", tipo:"accion", clase:"stocks", mon:"ARS"},
  {id:"TGSU2", nombre:"TGS", sector:"Energía", tipo:"accion", clase:"stocks", mon:"ARS"},
  {id:"CEPU", nombre:"Central Puerto", sector:"Eléctricas", tipo:"accion", clase:"stocks", mon:"ARS"},
  {id:"TRAN", nombre:"Transener", sector:"Eléctricas", tipo:"accion", clase:"stocks", mon:"ARS"},
  {id:"EDN", nombre:"Edenor", sector:"Eléctricas", tipo:"accion", clase:"stocks", mon:"ARS"},
  {id:"MELI", nombre:"Mercado Libre", sector:"Tecnología", tipo:"accion", clase:"cedears", mon:"ARS"},
  {id:"GLOB", nombre:"Globant", sector:"Tecnología", tipo:"accion", clase:"cedears", mon:"ARS"}
];
const PARAMS_DEF = {entrada:3, salida:5, media:20, tramos:3, comAcc:0.6, comCri:0.1};
const BOTS_DEF = [
  {id:"A", par:"BTC/USDT", rango:"±5%", escalones:10, capital:300000},
  {id:"B", par:"BTC/USDT", rango:"±12%", escalones:20, capital:300000},
  {id:"C", par:"ETH/USDT", rango:"±10%", escalones:15, capital:300000}
];

/* ============ Guardado local (con respaldo exportable) ============ */
const K = "ilab_v2_";
function leer(k, def){ try{ const v = localStorage.getItem(K+k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function guardar(k, v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }

const S = {
  params: Object.assign({}, PARAMS_DEF, leer("params", {})),
  cartera: leer("cartera", null),
  bots: leer("bots", BOTS_DEF),
  fotos: leer("fotos", []),
  chat: leer("chat", []),
  datos: {},     // id -> {serie:[{t,c,h,l}], precio, var, fuente, error}
  mep: null,
  cargado: false
};
if(!S.cartera){ S.cartera = {inicio:new Date().toISOString().slice(0,10), capARS:1500000, capUSDT:0, ars:1500000, usdt:0, lotes:[], diario:[], btcRef:null}; }

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const media = a => a.reduce((x,y)=>x+y,0)/a.length;
function ars(x){ return x==null||isNaN(x) ? "—" : "$ " + Math.round(x).toLocaleString("es-AR"); }
function usd(x, d=2){ return x==null||isNaN(x) ? "—" : "U$s " + Number(x).toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function px(a, x){ if(x==null||isNaN(x)) return "—"; return a.mon==="USDT" ? usd(x, x<10?4:2) : "$ " + Number(x).toLocaleString("es-AR",{maximumFractionDigits:x<100?2:0}); }
function pct(x, d=1){ return x==null||isNaN(x) ? "—" : (x>0?"+":"") + x.toFixed(d).replace(".",",") + "%"; }
function clsPct(x){ return x>0 ? "t-verde" : x<0 ? "t-rojo" : "muted"; }
function hoy(){ return new Date().toISOString().slice(0,10); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2600); }
function act(id){ return ACTIVOS.find(a=>a.id===id); }

/* ============ Datos de mercado ============ */
async function getJSON(url, ms=12000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url, {signal:c.signal}); const d = await r.json(); if(!r.ok) throw new Error(d && d.error || ("HTTP "+r.status)); return d; }
  finally{ clearTimeout(t); }
}
// Velas de Binance: primero directo desde el navegador; si no llega, por el servidor propio.
async function klines(sym, interval, limit, startTime){
  let q = `symbol=${sym}&interval=${interval}&limit=${limit}` + (startTime?`&startTime=${startTime}`:"");
  try{ return await getJSON(`https://api.binance.com/api/v3/klines?${q}`); }
  catch(e){
    try{ return await getJSON(`https://data-api.binance.vision/api/v3/klines?${q}`); }
    catch(e2){ return await getJSON(`/api/mercado?tipo=klines&${q}`); }
  }
}
function velasASerie(k){ return k.map(v=>({t:new Date(v[0]).toISOString().slice(0,10), ts:v[0], o:+v[1], h:+v[2], l:+v[3], c:+v[4]})); }

async function cargarCripto(a){
  const k = await klines(a.sym, "1d", 400);
  const serie = velasASerie(k);
  const precio = serie[serie.length-1].c, ant = serie[serie.length-2].c;
  S.datos[a.id] = {serie, precio, var:(precio/ant-1)*100, fuente:"Binance"};
}
function filaHist(x){
  const t = String(x.date||x.d||x.fecha||"").slice(0,10);
  return {t, o:+(x.o??x.open), h:+(x.h??x.high), l:+(x.l??x.low), c:+(x.c??x.close)};
}
let PANELES = {};
async function panel(nombre){
  if(!PANELES[nombre]) PANELES[nombre] = getJSON(`/api/mercado?tipo=live&panel=${nombre}`).catch(()=>[]);
  return PANELES[nombre];
}
async function cargarAccion(a){
  let hist, clase = a.clase;
  try{ hist = await getJSON(`/api/mercado?tipo=hist&clase=${clase}&ticker=${a.id}`); }
  catch(e){ if(!a.alt) throw e; clase = a.alt; hist = await getJSON(`/api/mercado?tipo=hist&clase=${clase}&ticker=${a.id}`); }
  const arr = Array.isArray(hist) ? hist : (hist.data || hist.values || []);
  let serie = arr.map(filaHist).filter(x=>x.t && x.c>0).sort((x,y)=>x.t<y.t?-1:1).slice(-400);
  if(serie.length < 30) throw new Error("Historial insuficiente");
  let precio = serie[serie.length-1].c, ant = serie[serie.length-2].c, fuente = "data912 (cierre)";
  const live = await panel(clase==="cedears" ? "arg_cedears" : "arg_stocks");
  const f = Array.isArray(live) ? live.find(x=>String(x.symbol).toUpperCase()===a.id) : null;
  if(f && +f.c > 0){
    precio = +f.c; fuente = "data912 (en vivo, con demora)";
    const ult = serie[serie.length-1];
    if(ult.t !== hoy()) serie.push({t:hoy(), o:precio, h:precio, l:precio, c:precio}); else { ult.c = precio; ant = serie[serie.length-2].c; }
  }
  S.datos[a.id] = {serie, precio, var:(precio/ant-1)*100, fuente};
}
async function cargarMEP(){
  try{
    const d = await getJSON(`/api/mercado?tipo=live&panel=mep`);
    const vals = (Array.isArray(d) ? d : [d]).map(x=>+(x.mark ?? x.close ?? x.c ?? x.venta ?? 0)).filter(v=>v>100 && v<100000).sort((x,y)=>x-y);
    S.mep = vals.length ? vals[Math.floor(vals.length/2)] : null;
  }catch(e){ S.mep = null; }
}
async function cargarTodo(){
  $("#estado").textContent = "Actualizando…";
  PANELES = {};
  await Promise.all([cargarMEP(), ...ACTIVOS.map(a => (a.tipo==="cripto" ? cargarCripto(a) : cargarAccion(a)).catch(e => { S.datos[a.id] = {error: e.message || "Sin datos"}; }))]);
  S.cargado = true;

/* ============ Análisis ============ */
function tendencia(serie){
  const c = serie.map(x=>x.c); if(c.length < 55) return {txt:"Sin datos", cls:"muted", k:"na"};
  const s20 = media(c.slice(-20)), s50 = media(c.slice(-50)), r20 = (c[c.length-1]/c[c.length-21]-1)*100;
  if(s20 > s50*1.01 && r20 > 3) return {txt:"Sube", cls:"t-verde", k:"sube", r20};
  if(s20 < s50*0.99 && r20 < -3) return {txt:"Baja", cls:"t-rojo", k:"baja", r20};
  return {txt:"Lateral", cls:"t-amarillo", k:"lateral", r20};
}
// Señal de la regla "comprar en baja por tramos, vender en alta" (la que probamos con datos reales).
function senal(a){
  const d = S.datos[a.id]; if(!d || d.error || !d.serie) return null;
  const P = S.params, c = d.serie.map(x=>x.c);
  if(c.length < P.media + 2) return null;
  const sma = media(c.slice(-P.media-1, -1)), p = d.precio, tr = tendencia(d.serie);
  const niveles = []; for(let k=1;k<=P.tramos;k++) niveles.push(sma*(1-P.entrada/100*k));
  const lotes = S.cartera.lotes.filter(l=>l.activo===a.id);
  const vender = lotes.filter(l=> p >= l.precio*(1+P.salida/100));
  let k = 0; niveles.forEach((n,i)=>{ if(p <= n) k = i+1; });
  let txt, cls, det;
  if(vender.length){ txt="Vender"; cls="t-verde"; det=`${vender.length} compra(s) simulada(s) ya ganan +${P.salida}% o más`; }
  else if(k>0 && tr.k==="baja"){ txt="Cautela"; cls="t-naranja"; det=`Está en zona de compra (tramo ${k}), pero la tendencia es bajista: la regla perdió en este escenario`; }
  else if(k>0){ txt=`Compra tramo ${k}`; cls="t-azul"; det=`${pct((p/sma-1)*100)} bajo su media de ${P.media} días`; }
  else { txt="Esperar"; cls="muted"; det=`Tramo 1 en ${px(a, niveles[0])} (${pct((niveles[0]/p-1)*100)})`; }
  return {txt, cls, det, sma, niveles, tr, vender};
}
// Simulación diaria de la regla (misma lógica que el estudio del 30/10/2026).
function backtest(serie, desde, P, comision, capital=1000000){
  const i0 = serie.findIndex(x=>x.t>=desde); if(i0 < P.media) return null;
  let cash = capital, lotes = [], ops = [], tr = capital/P.tramos, com = comision/100;
  for(let i=i0;i<serie.length;i++){
    const p = serie[i].c, sma = media(serie.slice(i-P.media, i).map(x=>x.c));
    for(const l of lotes.slice()){
      if(p >= l.precio*(1+P.salida/100)){ const v=l.q*p*(1-com); cash+=v; lotes.splice(lotes.indexOf(l),1); ops.push({t:serie[i].t, tipo:"Vende", p, res:(p/l.precio-1)*100}); }
    }
    const tiene = new Set(lotes.map(l=>l.k));
    for(let k=1;k<=P.tramos;k++){
      if(!tiene.has(k) && p <= sma*(1-P.entrada/100*k) && cash >= tr*0.99){
        const m = Math.min(tr, cash), q = m/(p*(1+com)); cash -= m; lotes.push({q, precio:p, k}); ops.push({t:serie[i].t, tipo:`Compra ${k}`, p});
      }
    }
  }
  const pf = serie[serie.length-1].c, fin = cash + lotes.reduce((s,l)=>s+l.q*pf*(1-com),0);
  const hold = (pf*(1-com))/(serie[i0].c*(1+com)) - 1;
  return {res:(fin/capital-1)*100, hold:hold*100, ops, abiertas:lotes.length, dias:serie.length-i0};
}
// Simulación de Bot de Grid (aritmético, spot) sobre velas por hora.
function simGrid(velas, piso, techo, n, capital, feePct){
  const fee = feePct/100, paso = (techo-piso)/n, slots = [];
  const p0 = velas[0].c;
  for(let i=0;i<n;i++){
    const lo = piso + paso*i, hi = lo + paso, m = capital/n;
    if(lo >= p0) slots.push({lo, hi, q:m/(p0*(1+fee)), cash:0});        // compra inicial: espera vender en hi
    else slots.push({lo, hi, q:0, cash:m});                                // espera comprar en lo
  }
  let ciclos = 0, ganancia = 0, salioPor = null;
  for(const v of velas){
    for(const s of slots){
      if(s.q===0 && v.l <= s.lo && s.lo < techo){ s.q = s.cash/(s.lo*(1+fee)); s.base = s.lo; s.cash = 0; }
      else if(s.q>0 && v.h >= s.hi){ const ing = s.q*s.hi*(1-fee); if(s.base!=null){ ganancia += ing - (capital/n); ciclos++; } s.cash = ing; s.q = 0; s.base = null; }
    }
    if(v.c < piso*0.99 && !salioPor) salioPor = "debajo del piso";
    if(v.c > techo*1.01 && !salioPor) salioPor = "encima del techo";
  }
  const pf = velas[velas.length-1].c;
  const fin = slots.reduce((t,s)=>t + s.cash + s.q*pf*(1-fee), 0);
  const hold = capital/(p0*(1+fee))*pf*(1-fee);
  const dias = (velas[velas.length-1].ts - velas[0].ts)/864e5 || 1;
  return {fin, res:(fin/capital-1)*100, hold:(hold/capital-1)*100, ciclos, ganancia, porDia:(fin-capital)/dias, dias, pasoPct:paso/((piso+techo)/2)*100, salioPor};
}

/* ============ Cartera simulada ============ */
function valorCartera(){
  const C = S.cartera; let ars_ = C.ars, usdt = C.usdt;
  for(const l of C.lotes){ const d = S.datos[l.activo]; const p = d && d.precio ? d.precio : l.precio; if(act(l.activo).mon==="USDT") usdt += l.q*p; else ars_ += l.q*p; }
  return {ars:ars_, usdt, totARS: S.mep ? ars_ + usdt*S.mep : null, capTot: S.mep ? C.capARS + C.capUSDT*S.mep : null};
}
function comprar(id, monto, motivo){
  const a = act(id), d = S.datos[id], C = S.cartera; if(!d || !d.precio) return toast("Sin precio para "+a.nombre);
  const com = (a.tipo==="cripto" ? S.params.comCri : S.params.comAcc)/100;
  const caja = a.mon==="USDT" ? "usdt" : "ars";
  if(!(monto>0) || monto > C[caja]+1e-9) return toast("Saldo simulado insuficiente");
  const q = monto/(d.precio*(1+com));
  C[caja] -= monto;
  C.lotes.push({id:Date.now(), activo:id, q, precio:d.precio, fecha:hoy(), monto});
  C.diario.push({fecha:new Date().toLocaleString("es-AR"), activo:id, accion:"Compra", precio:d.precio, monto, motivo:motivo||"Sin nota"});
  guardar("cartera", C); toast(`Compra simulada: ${a.nombre}`); render();
}
function vender(loteId, motivo){
  const C = S.cartera, l = C.lotes.find(x=>x.id===loteId); if(!l) return;
  const a = act(l.activo), d = S.datos[l.activo]; if(!d || !d.precio) return toast("Sin precio para vender");
  const com = (a.tipo==="cripto" ? S.params.comCri : S.params.comAcc)/100;
  const ing = l.q*d.precio*(1-com), caja = a.mon==="USDT" ? "usdt" : "ars";
  C[caja] += ing; C.lotes = C.lotes.filter(x=>x.id!==loteId);
  C.diario.push({fecha:new Date().toLocaleString("es-AR"), activo:l.activo, accion:"Venta", precio:d.precio, monto:ing, motivo:motivo||"Sin nota", res:(ing/l.monto-1)*100});
  guardar("cartera", C); toast(`Venta simulada: ${a.nombre} ${pct((ing/l.monto-1)*100)}`); render();
}

async function correrGrid(varias){
  const sym = $("#g-par").value, dias = +$("#g-dias").value, cap = +$("#g-cap").value || 300, fee = +$("#g-fee").value || 0.1;
  const box = $("#g-res"); box.innerHTML = `<div class="card"><p class="muted">Bajando ${dias} días de velas por hora de ${sym}…</p></div>`;
  let v;
  try{ v = await velasHora(sym, dias); }catch(e){ box.innerHTML = `<div class="card"><p class="t-rojo">No se pudieron bajar las velas: ${esc(e.message)}</p></div>`; return; }
  if(v.length < 24){ box.innerHTML = `<div class="card"><p class="t-rojo">Pocas velas para simular.</p></div>`; return; }
  const p0 = v[0].c;
  const correr = (r, n) => Object.assign(simGrid(v, p0*(1-r/100), p0*(1+r/100), n, cap, fee), {r, n});
  let res;
  if(varias){ res = []; for(const r of [5,10,15]) for(const n of [10,20,30]) res.push(correr(r,n)); res.sort((x,y)=>y.res-x.res); }
  else res = [correr(+$("#g-rango").value || 10, Math.max(2, Math.min(200, +$("#g-n").value || 15)))];
  const mejor = res[0];
  box.innerHTML = `
  <div class="card">
    <div class="sec-head"><b>${varias ? "Mejor configuración" : "Resultado"}</b><span class="small muted">${v[0].t} → ${v[v.length-1].t}</span></div>
    <div class="grid3">
      <div class="kpi"><span class="kl">Bot</span><b class="${clsPct(mejor.res)}">${pct(mejor.res,2)}</b><span class="ks">${usd(mejor.fin-cap)}</span></div>
      <div class="kpi"><span class="kl">Por día</span><b class="${clsPct(mejor.porDia)}">${mejor.porDia>0?"+":""}${mejor.porDia.toFixed(2).replace(".",",")}</b><span class="ks">U$s · ${mejor.ciclos} ciclos</span></div>
      <div class="kpi"><span class="kl">Mantener</span><b class="${clsPct(mejor.hold)}">${pct(mejor.hold,2)}</b><span class="ks">Comprar y esperar</span></div>
    </div>
    <p class="small">Rango ±${mejor.r}% · ${mejor.n} escalones de ${pct(mejor.pasoPct,2).replace("+","")} · ${mejor.pasoPct < 2*fee+0.3 ? `<span class="t-rojo">escalón muy chico: la comisión se come la ganancia</span>` : `<span class="muted">escalón cubre la comisión</span>`}</p>
    ${mejor.salioPor ? `<p class="small t-naranja">El precio salió del rango (${mejor.salioPor}). En Binance conviene poner un stop en el piso.</p>` : ""}
  </div>
  ${varias ? `<div class="card tbl"><table><thead><tr><th>Rango</th><th>Escalones</th><th>Bot</th><th>Por día</th><th>Ciclos</th></tr></thead><tbody>
    ${res.map(x=>`<tr><td>±${x.r}%</td><td>${x.n}</td><td class="${clsPct(x.res)}">${pct(x.res,2)}</td><td>${usd(x.porDia)}</td><td>${x.ciclos}</td></tr>`).join("")}</tbody></table>
    <p class="small muted" style="margin-top:8px">Ojo: la mejor del pasado no garantiza el futuro. Elegí una que ande bien en varios períodos, no solo en uno.</p></div>` : ""}`;
}

function correrRegla(todos){
  const P = {entrada:+$("#bt-e").value||3, salida:+$("#bt-s").value||5, media:Math.max(5,+$("#bt-m").value||20), tramos:Math.max(1,Math.min(5,+$("#bt-t").value||3))};
  const desde = $("#bt-desde").value, box = $("#bt-res");
  const lista = todos ? ACTIVOS : [act($("#bt-act").value)];
  const filas = lista.map(a=>{ const d = S.datos[a.id]; if(!d || !d.serie) return {a, r:null}; return {a, r:backtest(d.serie, desde, P, a.tipo==="cripto" ? S.params.comCri : S.params.comAcc)}; });
  if(!todos){
    const {a, r} = filas[0];
    if(!r){ box.innerHTML = `<div class="card"><p class="t-rojo">No hay datos suficientes para ${esc(a.nombre)} desde esa fecha.</p></div>`; return; }
    box.innerHTML = `<div class="card">
      <div class="grid3">
        <div class="kpi"><span class="kl">Regla</span><b class="${clsPct(r.res)}">${pct(r.res)}</b><span class="ks">${r.ops.length} operaciones</span></div>
        <div class="kpi"><span class="kl">Mantener</span><b class="${clsPct(r.hold)}">${pct(r.hold)}</b><span class="ks">${r.dias} ruedas</span></div>
        <div class="kpi"><span class="kl">Abiertas</span><b>${r.abiertas}</b><span class="ks">tramos sin vender</span></div>
      </div>
      ${r.ops.length ? `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Operación</th><th>Precio</th><th>Resultado</th></tr></thead><tbody>
        ${r.ops.map(o=>`<tr><td>${o.t}</td><td>${o.tipo}</td><td class="mono">${px(a,o.p)}</td><td class="${clsPct(o.res)}">${o.res!=null?pct(o.res):""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">La regla no disparó en el período.</p>`}
    </div>`;
    return;
  }
  const ok = filas.filter(f=>f.r);
  const prom = ok.length ? media(ok.map(f=>f.r.res)) : null;
  box.innerHTML = `<div class="card tbl">
    <div class="sec-head"><b>Todos los activos</b><span class="small">Promedio <span class="${clsPct(prom)}">${pct(prom)}</span></span></div>
    <table><thead><tr><th>Activo</th><th>Regla</th><th>Mantener</th><th>Ops</th></tr></thead><tbody>
    ${filas.sort((x,y)=>(y.r?y.r.res:-999)-(x.r?x.r.res:-999)).map(({a,r})=>`<tr><td>${esc(a.nombre)}</td>${r ? `<td class="${clsPct(r.res)}">${pct(r.res)}</td><td class="${clsPct(r.hold)}">${pct(r.hold)}</td><td>${r.ops.length}</td>` : `<td colspan="3" class="muted">Sin datos</td>`}</tr>`).join("")}
    </tbody></table>
    <p class="small muted" style="margin-top:8px">Comisión ${S.params.comAcc}% acciones / ${S.params.comCri}% cripto por operación. Precios de cierre diarios.</p></div>`;
}

function importar(file){
  if(!file) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); ["params","cartera","bots","fotos","chat","robots"].forEach(k=>{ if(d[k]){ S[k]=d[k]; guardar(k, d[k]); } }); toast("Respaldo importado"); render(); }catch(e){ toast("Archivo no válido"); } };
  r.readAsText(file);
}

  <div class="sec"><p class="eyebrow">Socio IA</p><h1>Hablemos del mercado</h1><p class="small muted">Ve las señales, tendencias, tu cartera simulada y los bots. Analiza y te avisa; las decisiones las tomás vos.</p></div>
  <div class="msgs" id="msgs">${S.chat.length ? S.chat.map(m=>`<div class="msg ${m.role==="user"?"yo":"ia glass"}">${esc(m.content)}</div>`).join("") :
    `<div class="card"><p class="small muted">Probá con:</p>${["¿Qué activo está para comprar hoy según la regla?","¿Cómo vienen los bots esta semana?","¿Conviene ajustar el rango del Grid de BTC?"].map(t=>`<button class="btn sm ghost" style="text-align:left" onclick="$('#ch-in').value=this.textContent">${t}</button>`).join("")}</div>`}</div>
  <form class="chatbar" onsubmit="event.preventDefault();enviar()"><input id="ch-in" placeholder="Escribí tu consulta…" autocomplete="off"><button class="btn gold" id="ch-b">Enviar</button></form>
  ${S.chat.length ? `<button class="btn ghost sm" onclick="S.chat=[];guardar('chat',[]);vSocio()">Borrar conversación</button>` : ""}`;
  const m = $("#msgs"); m.lastElementChild && m.lastElementChild.scrollIntoView({block:"end"});
}
async function enviar(){
  const inp = $("#ch-in"), t = inp.value.trim(); if(!t) return;
  const hist = S.chat.slice(-8);
  S.chat.push({role:"user", content:t}); inp.value = ""; vSocio();
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="msg ia glass muted" id="pens">Analizando…</div>`);
  $("#ch-b").disabled = true;
  try{

    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "No respondió");

  }catch(e){ S.chat.push({role:"assistant", content:"No pude responder: " + e.message}); }
  S.chat = S.chat.slice(-30); guardar("chat", S.chat); vSocio();
}

/* ============ Fábrica de robots ============
   Genera miles de reglas, las prueba con velas reales de Binance (70% entrenamiento / 30% validación),
   descarta las que no pasan y deja adoptar las sobrevivientes en papel. Solo compras en spot, sin apalancamiento. */
const FAB_INT = {"1h":{dias:180, label:"1 hora"}, "4h":{dias:730, label:"4 horas"}, "1d":{dias:1000, label:"1 día"}};
const FAB_SYMS = [["BTCUSDT","BTC"],["ETHUSDT","ETH"],["SOLUSDT","SOL"]];
const FAMILIAS = {
  cruce:  {nombre:"Cruce de medias", grid:{f:[5,10,20], s:[30,50,100,200]}},
  ruptura:{nombre:"Ruptura", grid:{n:[10,20,50], m:[5,10,20]}},
  rsi:    {nombre:"Rebote RSI", grid:{lo:[25,30,35], hi:[50,60,70]}},
  baja:   {nombre:"Baja/alza", grid:{n:[10,20,50], e:[2,3,5], s:[3,5,8]}}
};
const FAB_SL = [0, 5, 10], FAB_TF = [false, true];
S.robots = leer("robots", []);
const VELAS_CACHE = {};

async function velasRango(sym, interval, dias){
  const key = sym+interval+dias; const c = VELAS_CACHE[key]; if(c && Date.now()-c.t < 10*60*1000) return c.v;
  const fin = Date.now(), ini = fin - dias*864e5; let out = [], t = ini;
  for(let pag=0; pag<8 && t < fin; pag++){
    const k = await klines(sym, interval, 1000, t); if(!k.length) break;
    out = out.concat(velasASerie(k)); t = k[k.length-1][0] + 1; if(k.length < 1000) break;
  }
  VELAS_CACHE[key] = {t:Date.now(), v:out}; return out;
}
function smaArr(c, n){ const o = new Array(c.length).fill(null); let s = 0; for(let i=0;i<c.length;i++){ s += c[i]; if(i>=n) s -= c[i-n]; if(i>=n-1) o[i] = s/n; } return o; }
function rsiArr(c, n=14){ const o = new Array(c.length).fill(null); let g=0, l=0;
  for(let i=1;i<c.length;i++){ const d = c[i]-c[i-1], up = Math.max(d,0), dn = Math.max(-d,0);
    if(i<=n){ g += up; l += dn; if(i===n){ g/=n; l/=n; o[i] = l===0 ? 100 : 100-100/(1+g/l); } }
    else { g = (g*(n-1)+up)/n; l = (l*(n-1)+dn)/n; o[i] = l===0 ? 100 : 100-100/(1+g/l); } }
  return o; }
function indicadores(v){
  const c = v.map(x=>x.c), h = v.map(x=>x.h), l = v.map(x=>x.l), I = {c, h, l, sma:{}, rsi:rsiArr(c)};
  [5,10,20,30,50,100,200].forEach(n=>I.sma[n] = smaArr(c, n));
  return I;
}
function maxPrev(a, i, n){ let m = -Infinity; for(let j=i-n;j<i;j++) if(a[j] > m) m = a[j]; return m; }
function minPrev(a, i, n){ let m = Infinity; for(let j=i-n;j<i;j++) if(a[j] < m) m = a[j]; return m; }
function entra(R, I, i){
  const p = R.p, c = I.c;
  if(R.fam==="cruce"){ const f = I.sma[p.f][i], s = I.sma[p.s][i]; return f!=null && s!=null && f > s; }
  if(R.fam==="ruptura") return i >= p.n && c[i] > maxPrev(c, i, p.n);
  if(R.fam==="rsi") return I.rsi[i]!=null && I.rsi[i] < p.lo;
  if(R.fam==="baja"){ const m = I.sma[p.n][i-1]; return m!=null && c[i] <= m*(1-p.e/100); }
}
function sale(R, I, i, entrada){
  const p = R.p, c = I.c;
  if(R.fam==="cruce"){ const f = I.sma[p.f][i], s = I.sma[p.s][i]; return f!=null && s!=null && f < s; }
  if(R.fam==="ruptura") return i >= p.m && c[i] < minPrev(I.l, i, p.m);
  if(R.fam==="rsi") return I.rsi[i]!=null && I.rsi[i] > p.hi;
  if(R.fam==="baja") return c[i] >= entrada*(1+p.s/100);
}
// Corre un robot entre las velas i0 e i1. Opera al cierre de la vela; el stop se ejecuta en su precio.
function correrRobot(R, I, i0, i1, fee){
  let pos = false, ent = 0, eq = 1, pico = 1, dd = 0, ops = 0, gan = 0, desde = null;
  for(let i=i0;i<=i1;i++){
    if(pos){
      let px = null;
      if(R.sl && I.l[i] <= ent*(1-R.sl/100)) px = ent*(1-R.sl/100);
      else if(sale(R, I, i, ent)) px = I.c[i];
      if(px!=null){ const r = px*(1-fee)/(ent*(1+fee)); eq *= r; ops++; if(r>1) gan++; pos = false; }
    } else if(entra(R, I, i) && (!R.tf || (I.sma[200][i]!=null && I.c[i] > I.sma[200][i]))){ pos = true; ent = I.c[i]; desde = i; }
    const cur = pos ? eq*I.c[i]*(1-fee)/(ent*(1+fee)) : eq;
    if(cur > pico) pico = cur; dd = Math.max(dd, (1-cur/pico)*100);
  }
  const fin = pos ? eq*I.c[i1]*(1-fee)/(ent*(1+fee)) : eq;
  return {ret:(fin-1)*100, dd, ops, win: ops ? gan/ops*100 : 0, pos, ent, desde};
}
function nombreRobot(R){
  const p = R.p, sym = R.sym.replace("USDT",""), base =
    R.fam==="cruce" ? `Cruce ${p.f}/${p.s}` : R.fam==="ruptura" ? `Ruptura ${p.n}/${p.m}` : R.fam==="rsi" ? `RSI ${p.lo}→${p.hi}` : `Baja/alza ${p.n}: −${p.e}% / +${p.s}%`;
  return `${sym} ${FAB_INT[R.int].label} · ${base}${R.sl ? ` · stop ${R.sl}%` : ""}${R.tf ? " · solo en tendencia" : ""}`;
}
function explicarRobot(R){
  const p = R.p, v = FAB_INT[R.int].label.replace("1 ","");
  const t = R.fam==="cruce" ? `Compra cuando la media de ${p.f} velas de ${v} pasa por encima de la de ${p.s}, y vende cuando cruza por debajo.`
    : R.fam==="ruptura" ? `Compra cuando el precio supera el máximo de las últimas ${p.n} velas, y vende cuando perfora el mínimo de las últimas ${p.m}.`
    : R.fam==="rsi" ? `Compra cuando el RSI cae debajo de ${p.lo} (sobreventa) y vende cuando supera ${p.hi}.`
    : `Compra cuando el precio cae ${p.e}% bajo su media de ${p.n} velas y vende con +${p.s}%.`;
  return t + (R.sl ? ` Si cae ${R.sl}% desde la compra, sale.` : "") + (R.tf ? " Solo compra si el precio está sobre su media de 200 velas." : "");
}
function combos(grid){ const ks = Object.keys(grid); let out = [{}];
  for(const k of ks) out = out.flatMap(o=>grid[k].map((v,ix)=>Object.assign({}, o, {[k]:v, ["_"+k]:ix}))); return out; }
function vecinos(A, B){ if(A.fam!==B.fam || A.sym!==B.sym || A.int!==B.int || A.sl!==B.sl || A.tf!==B.tf) return false;
  let d = 0; for(const k of Object.keys(FAMILIAS[A.fam].grid)) d += Math.abs(A.p["_"+k]-B.p["_"+k]); return d===1; }

let FAB_RES = null;
async function fabricar(){
  const syms = FAB_SYMS.filter(([s])=>$("#fb-"+s).checked).map(([s])=>s), ints = Object.keys(FAB_INT).filter(k=>$("#fi-"+k).checked);
  if(!syms.length || !ints.length) return toast("Elegí al menos un activo y una temporalidad");
  const box = $("#fb-res"), fee = S.params.comCri/100, todos = [], fallas = [];
  $("#fb-go").disabled = true;
  for(const sym of syms) for(const int of ints){
    box.innerHTML = `<div class="card"><p class="muted">Bajando velas de ${sym} (${FAB_INT[int].label})…</p></div>`;
    let v; try{ v = await velasRango(sym, int, FAB_INT[int].dias); }catch(e){ fallas.push(`${sym} ${FAB_INT[int].label}`); continue; }
    if(v.length < 400){ fallas.push(`${sym} ${FAB_INT[int].label} (pocas velas)`); continue; }
    box.innerHTML = `<div class="card"><p class="muted">Probando robots en ${sym} (${FAB_INT[int].label})… ${todos.length} probados</p></div>`;
    await new Promise(r=>setTimeout(r, 20));
    const I = indicadores(v), i0 = 200, corte = i0 + Math.floor((v.length-1-i0)*0.7), fin = v.length-1;
    const holdE = (I.c[corte]/I.c[i0]-1)*100, holdV = (I.c[fin]/I.c[corte+1]-1)*100;
    for(const fam of Object.keys(FAMILIAS)) for(const p of combos(FAMILIAS[fam].grid)){
      if(fam==="cruce" && p.f >= p.s) continue;
      if(fam==="rsi" && p.hi <= p.lo) continue;
      for(const sl of FAB_SL) for(const tf of FAB_TF){
        const R = {fam, p, sym, int, sl, tf};
        R.e = correrRobot(R, I, i0, corte, fee); R.v = correrRobot(R, I, corte+1, fin, fee);
        R.holdE = holdE; R.holdV = holdV; R.fechaCorte = v[corte].t; R.fechaFin = v[fin].t; R.fechaIni = v[i0].t;
        todos.push(R);
      }
    }
  }
  const minOps = R => R.int==="1d" ? 4 : 8;
  const etapa1 = todos.filter(R => R.e.ret > 0 && R.e.ops >= minOps(R) && R.e.dd < 35);
  const etapa2 = etapa1.filter(R => R.v.ret > 0 && R.v.dd < 25 && R.v.ops >= 2);
  const etapa3 = etapa2.filter(R => todos.filter(X => vecinos(R, X) && X.v.ret > 0 && X.e.ret > 0).length >= 2);
  etapa3.forEach(R => R.score = R.v.ret / Math.max(R.v.dd, 2) + R.e.ret / Math.max(R.e.dd, 2) * 0.5);
  etapa3.sort((a,b)=>b.score-a.score || (a.sl-b.sl));
  const vistos = new Set();   // si el stop o el filtro no cambian nada, queda solo la versión más simple
  const unicos = etapa3.filter(R => { const k = [R.fam, JSON.stringify(R.p), R.sym, R.int, R.v.ret.toFixed(3), R.e.ret.toFixed(3)].join("|"); if(vistos.has(k)) return false; vistos.add(k); return true; });
  FAB_RES = {todos:todos.length, e1:etapa1.length, e2:etapa2.length, e3:etapa3.length, top:unicos.slice(0, 15), fallas};
  $("#fb-go").disabled = false;
  pintarFabrica();
}
function pintarFabrica(){
  const box = $("#fb-res"); if(!box || !FAB_RES) return; const F = FAB_RES;
  const barra = (n, txt) => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${txt}</span><span class="mono">${n.toLocaleString("es-AR")}</span></div><div style="height:6px;border-radius:999px;background:var(--line);overflow:hidden"><div style="height:100%;width:${Math.max(1, n/F.todos*100)}%;background:var(--gold)"></div></div>`;
  box.innerHTML = `
  <div class="card">
    <b>Embudo de la fábrica</b>
    ${barra(F.todos, "Robots generados y probados")}
    ${barra(F.e1, "Ganaron en entrenamiento (70% del historial)")}
    ${barra(F.e2, "Ganaron también en validación (30% que no vieron)")}
    ${barra(F.e3, "Robustos: sus versiones vecinas también ganan")}
    ${F.fallas && F.fallas.length ? `<p class="small t-naranja">Sin datos: ${esc(F.fallas.join(", "))}</p>` : ""}
    <p class="small muted">Descartados: ${F.todos ? pct((1-F.e3/F.todos)*100).replace("+","") : "—"}. Que sobrevivan pocos es buena señal: el filtro funciona.</p>
  </div>
  ${F.top.length ? `<div class="list">${F.top.map((R,ix)=>`
    <div class="card">
      <div class="sec-head"><b>${esc(nombreRobot(R))}</b></div>
      <p class="small muted">${esc(explicarRobot(R))}</p>
      <div class="grid2">
        <div class="kpi"><span class="kl">Validación (${R.fechaCorte} → ${R.fechaFin})</span><b class="${clsPct(R.v.ret)}">${pct(R.v.ret)}</b><span class="ks">Mantener ${pct(R.holdV)} · caída máx ${R.v.dd.toFixed(1).replace(".",",")}% · ${R.v.ops} ops</span></div>
        <div class="kpi"><span class="kl">Entrenamiento</span><b class="${clsPct(R.e.ret)}">${pct(R.e.ret)}</b><span class="ks">Mantener ${pct(R.holdE)} · ${R.e.ops} ops · ${R.e.win.toFixed(0)}% aciertos</span></div>
      </div>
      <button class="btn sm" onclick="adoptar(${ix})">Adoptar en papel</button>
    </div>`).join("")}</div>`
  : `<div class="card"><p>Ningún robot pasó todos los filtros. <span class="muted">Es un resultado válido: mejor no operar que operar con algo que no funciona.</span></p></div>`}
  <p class="disc">Resultados pasados, con comisión ${S.params.comCri}% por lado. Un robot que pasó los filtros todavía tiene que demostrar que funciona en papel antes de usar dinero real.</p>`;
}
function adoptar(ix){
  const R = FAB_RES.top[ix]; if(!R) return;
  const r = {id:Date.now(), fam:R.fam, p:R.p, sym:R.sym, int:R.int, sl:R.sl, tf:R.tf, nombre:nombreRobot(R), desde:Date.now(), val:R.v.ret, holdV:R.holdV};
  if(S.robots.some(x=>x.nombre===r.nombre)) return toast("Ese robot ya está adoptado");
  S.robots.push(r); guardar("robots", S.robots); toast("Robot adoptado en papel"); estadoRobots();
}
// Estado en vivo de cada robot adoptado: si hoy está comprado o afuera, señal nueva y resultado desde que se adoptó.
async function estadoRobots(){
  const fee = S.params.comCri/100;
  for(const r of S.robots){
    try{
      const v = await velasRango(r.sym, r.int, Math.min(FAB_INT[r.int].dias, r.int==="1h" ? 60 : r.int==="4h" ? 200 : 500));
      const I = indicadores(v), fin = v.length-1, R = r;
      const hoyEst = correrRobot(R, I, 200, fin, fee), ayerEst = correrRobot(R, I, 200, fin-1, fee);
      const iA = v.findIndex(x=>x.ts >= r.desde);
      const papel = iA >= 0 && iA < fin ? correrRobot(R, I, iA, fin, fee) : null;
      r.vivo = {pos:hoyEst.pos, ent:hoyEst.ent, precio:I.c[fin], cambio: hoyEst.pos!==ayerEst.pos, papel, hold: iA>=0 ? (I.c[fin]/I.c[iA]-1)*100 : null, act:v[fin].t};
    }catch(e){ r.vivo = {error:e.message}; }
  }
  if(VISTA==="lab" && LAB==="fabrica") pintarRobots();
  if(VISTA==="inicio") vInicio();
}
function senalRobot(r){
  const v = r.vivo; if(!v) return {txt:"Cargando", cls:"muted"}; if(v.error) return {txt:"Sin datos", cls:"t-rojo"};
  if(v.cambio) return v.pos ? {txt:"Comprar ahora", cls:"t-azul"} : {txt:"Vender ahora", cls:"t-verde"};
  return v.pos ? {txt:"Comprado", cls:"t-amarillo"} : {txt:"Afuera", cls:"muted"};
}
function pintarRobots(){
  const el = $("#fb-robots"); if(!el) return;
  el.innerHTML = S.robots.length ? `<div class="list">${S.robots.map(r=>{ const s = senalRobot(r), v = r.vivo || {}; return `
    <div class="card">
      <div class="sec-head"><b>${esc(r.nombre)}</b><span class="status ${s.cls}">${s.txt}</span></div>
      <p class="small muted">Adoptado ${new Date(r.desde).toLocaleDateString("es-AR")} · Validación ${pct(r.val)}${v.precio ? ` · Precio ${usd(v.precio, v.precio<10?4:2)}` : ""}</p>
      ${v.papel ? `<p class="small">En papel desde que se adoptó: <span class="${clsPct(v.papel.ret)}">${pct(v.papel.ret,2)}</span> · Mantener <span class="${clsPct(v.hold)}">${pct(v.hold,2)}</span> · ${v.papel.ops} ops</p>` : `<p class="small muted">Todavía no hay velas nuevas desde que se adoptó.</p>`}
      <button class="btn sm ghost" onclick="S.robots=S.robots.filter(x=>x.id!==${r.id});guardar('robots',S.robots);pintarRobots()">Quitar</button>
    </div>`; }).join("")}</div>`
  : `<p class="muted small">Todavía no adoptaste ningún robot.</p>`;
}
function labFabrica(){
  $("#lab-c").innerHTML = `
  <div class="card">
    <p class="small muted">Genera miles de robots con 4 tipos de reglas, los prueba con velas reales de Binance y descarta los que no pasan. Solo compras en spot, sin apalancamiento.</p>
    <div><p class="eyebrow" style="margin-bottom:6px">Activos</p><div class="row2">${FAB_SYMS.map(([s,n])=>`<label class="chip" style="padding:8px 12px"><input type="checkbox" id="fb-${s}" ${s!=="SOLUSDT"?"checked":""}> ${n}</label>`).join("")}</div></div>
    <div><p class="eyebrow" style="margin-bottom:6px">Temporalidad</p><div class="row2">${Object.entries(FAB_INT).map(([k,x])=>`<label class="chip" style="padding:8px 12px"><input type="checkbox" id="fi-${k}" ${k!=="1h"?"checked":""}> ${x.label}</label>`).join("")}</div></div>
    <button class="btn gold full" id="fb-go" onclick="fabricar()">Fabricar robots</button>
    <p class="small muted">Tarda entre 20 segundos y 2 minutos según lo que elijas.</p>
  </div>
  <div id="fb-res"></div>
  <section class="sec"><div class="sec-head"><h2>Robots adoptados</h2><button class="btn sm ghost" onclick="estadoRobots()">Actualizar</button></div><div id="fb-robots"></div></section>`;
  pintarFabrica(); pintarRobots();
  if(S.robots.length && S.robots.some(r=>!r.vivo)) estadoRobots();
}

function robotsInicio(){
  if(!S.robots.length) return `<section class="sec"><h2>Robots</h2><div class="card"><p class="small">Todavía no hay robots en prueba.</p><button class="btn sm gold" onclick="LAB='fabrica';irA('lab')">Ir a la fábrica de robots</button></div></section>`;
  return `<section class="sec"><div class="sec-head"><h2>Robots en papel</h2><button class="btn sm ghost" onclick="LAB='fabrica';irA('lab')">Ver todos</button></div><div class="list">${S.robots.map(r=>{ const s = senalRobot(r), v = r.vivo || {}; return `
    <div class="arow glass"><div><div class="n" style="font-size:14px">${esc(r.nombre)}</div><div class="s">${v.papel ? `En papel <span class="${clsPct(v.papel.ret)}">${pct(v.papel.ret,2)}</span> · Mantener ${pct(v.hold,2)}` : "Recién adoptado"}</div></div><span class="status ${s.cls}">${s.txt}</span></div>`; }).join("")}</div></section>`;
}
